<title>StagePatch</title>
<style>
/*
 * Adapted from packages/web/src/styles.css so the demo looks like the product.
 * Dark by default: this is read at a dim FOH position, where a white screen
 * costs the operator their night vision.
 */
:root {
  --bg: #14161a;
  --surface: #1c1f25;
  --surface-raised: #23272f;
  --border: #313640;
  --text: #e8eaed;
  --text-dim: #9aa2ae;
  --accent: #4a9eff;
  --error: #ff6b6b;
  --warning: #ffb454;
  --ok: #4ade80;
  color-scheme: dark;
}
/*
 * Dark-first, so the light palette is defined twice: once for viewers whose OS
 * says light and who have made no explicit choice (the default "system" state
 * stamps nothing on the root, so only the media query separates them), and once
 * for viewers who explicitly picked light. Without the media query a
 * system-light viewer would silently get the dark palette.
 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-raised: #eceef1;
    --border: #d4d8de;
    --text: #16181d;
    --text-dim: #5c6470;
    --accent: #0b62d0;
    --error: #c02626;
    --warning: #9a5b00;
    --ok: #1c7a3e;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-raised: #eceef1;
  --border: #d4d8de;
  --text: #16181d;
  --text-dim: #5c6470;
  --accent: #0b62d0;
  --error: #c02626;
  --warning: #9a5b00;
  --ok: #1c7a3e;
  color-scheme: light;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  font-size: 15px;
  direction: rtl;
  overflow-x: hidden;
}

.app { max-width: 1400px; margin: 0 auto; padding: 1.25rem; }

header.top {
  display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap;
  margin-bottom: 1rem; padding-bottom: 0.9rem; border-bottom: 1px solid var(--border);
}
header.top h1 { margin: 0; font-size: 1.35rem; letter-spacing: -0.01em; }
header.top .sub { color: var(--text-dim); font-size: 0.88rem; }
header.top .spacer { flex: 1; }

.banner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-inline-start: 3px solid var(--accent);
  border-radius: 6px;
  padding: 0.75rem 1rem;
  margin-bottom: 1rem;
  font-size: 0.87rem;
  line-height: 1.6;
  color: var(--text-dim);
}
.banner strong { color: var(--text); }

nav.steps { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
nav.steps button {
  background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
  padding: 0.45rem 0.95rem; border-radius: 6px; cursor: pointer; font: inherit; font-size: 0.88rem;
}
nav.steps button[aria-current="true"] {
  background: var(--surface-raised); border-color: var(--accent); color: var(--text);
}

section.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 1.1rem; margin-bottom: 1rem;
}
section.panel > h2 { margin: 0 0 0.9rem; font-size: 1.05rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
section.panel h3 { margin: 1.1rem 0 0.5rem; font-size: 0.9rem; color: var(--text-dim); font-weight: 600; }

label { display: block; font-size: 0.87rem; }
label > span { display: block; margin-bottom: 0.2rem; color: var(--text-dim); font-size: 0.8rem; }

input, select, textarea {
  width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
  padding: 0.4rem 0.55rem; border-radius: 5px; font: inherit; font-size: 0.88rem;
}
input[type="checkbox"] { width: auto; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { min-height: 130px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.82rem; line-height: 1.5; }

button.primary {
  background: var(--accent); border: none; color: #08111d; font-weight: 600;
  padding: 0.5rem 1.05rem; border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600; font-size: 0.9rem;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) button.primary { color: #fff; }
}
:root[data-theme="light"] button.primary { color: #fff; }
button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

button.ghost {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font: inherit; font-size: 0.85rem;
}
button.ghost:hover { background: var(--surface-raised); }
button.tiny { padding: 0.1rem 0.4rem; font-size: 0.8rem; line-height: 1.3; }

.row { display: flex; gap: 0.7rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 0.6rem; }
.row > label { flex: 1 1 130px; }
.row > button { flex: 0 0 auto; }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 1rem; align-items: start; }
@media (max-width: 1000px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }

/* The patch table is the screen that matters; it scrolls inside its own box so
   the page body never scrolls sideways. */
.table-scroll { overflow-x: auto; max-width: 100%; }
table.patch { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
table.patch th, table.patch td { border-bottom: 1px solid var(--border); padding: 0.3rem 0.45rem; text-align: start; }
table.patch th { color: var(--text-dim); font-weight: 600; font-size: 0.76rem; position: sticky; top: 0; background: var(--surface); }
table.patch tbody tr:hover { background: var(--surface-raised); }
table.patch td.num { font-variant-numeric: tabular-nums; color: var(--text-dim); }
table.patch input, table.patch select { padding: 0.15rem 0.3rem; font-size: 0.82rem; }
table.patch td.name input { min-width: 120px; }
/* Without a floor these collapse to a few characters and the chosen value is
   unreadable — the whole point of showing the column. */
table.patch select { min-width: 118px; }

.chip { display: inline-block; padding: 0.05rem 0.4rem; border-radius: 4px; font-size: 0.73rem; border: 1px solid var(--border); color: var(--text-dim); }
.chip.shared { border-color: var(--ok); color: var(--ok); }
.chip.bad { border-color: var(--error); color: var(--error); }

ul.notes { list-style: none; margin: 0; padding: 0; }
ul.notes li {
  border-inline-start: 3px solid var(--border); padding: 0.45rem 0.7rem; margin-bottom: 0.45rem;
  background: var(--bg); border-radius: 0 5px 5px 0; font-size: 0.83rem; line-height: 1.5;
}
/* Conflict text comes from the engine and is English inside an RTL page.
   `plaintext` gives each message the direction of its own first strong
   character, so English sentences read left-to-right where they sit. */
ul.notes li, .hint { unicode-bidi: plaintext; }
ul.notes li.error { border-inline-start-color: var(--error); }
ul.notes li.warning { border-inline-start-color: var(--warning); }
ul.notes li .suggestion { display: block; margin-top: 0.2rem; color: var(--text-dim); }

.empty { color: var(--text-dim); font-size: 0.87rem; }
.hint { color: var(--text-dim); font-size: 0.82rem; margin: 0.5rem 0 0; line-height: 1.6; }
.actions { display: flex; gap: 0.55rem; flex-wrap: wrap; margin-top: 0.9rem; align-items: center; }

pre.scene {
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  padding: 0.8rem; max-height: 340px; overflow: auto; direction: ltr; text-align: left;
  font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.78rem; line-height: 1.55; margin: 0;
}
.caution {
  background: color-mix(in srgb, var(--error) 12%, var(--surface));
  border: 1px solid var(--error); border-radius: 6px; padding: 0.7rem 0.9rem;
  font-size: 0.85rem; line-height: 1.6; margin-top: 1rem;
}
.stat { display: flex; gap: 1.25rem; flex-wrap: wrap; margin-bottom: 0.9rem; }
.stat div { font-size: 0.82rem; color: var(--text-dim); }
.stat div b { display: block; font-size: 1.3rem; color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
</style>

    if (!plan) {
      return [el('section', { class: 'panel' }, [
        el('p', { class: 'empty', text: 'עדיין אין ערוצים. חזור לשלב 2 וטען את המפרטים האמיתיים.' }),
      ])];
    }

    const errors = plan.conflicts.filter((c) => c.severity === 'error');

    const table = el('table', { class: 'patch' }, [
      el('thead', {}, [el('tr', {}, [
        el('th', { text: 'ערוץ' }), el('th', { text: 'שם' }), el('th', { text: 'פריסט' }),
        el('th', { text: 'מיק / DI' }), el('th', { text: '48V' }),
        el('th', { text: 'אזור' }), el('th', { text: 'מולטי' }), el('th', { text: 'קו' }),
        el('th', { text: 'כניסה' }), el('th', { text: 'להקות' }), el('th', { text: 'סדר' }),
      ])]),
    ]);

    const tbody = el('tbody', {}, []);
    plan.channels.forEach((ch, i) => {
      tbody.appendChild(el('tr', {}, [
        el('td', { class: 'num', text: String(ch.channelNumber) }),
        el('td', { class: 'name' }, [el('input', {
          type: 'text', value: ch.name, maxlength: '12',
          oninput: (e) => { ch.name = e.target.value; },
        })]),
        el('td', {}, [select(INSTRUMENTS, ch.presetId, (v) => { ch.presetId = v; render(); })]),
        // The mic model already says how the source arrives ("DI", "Wireless
        // RX"), so a separate source-type column costs width for no new
        // information. It only appears when the rider named no model.
        el('td', { text: ch.micModel || ch.sourceType.toUpperCase() }),
        el('td', {}, [el('input', { type: 'checkbox', checked: !!ch.phantom, onchange: (e) => { ch.phantom = e.target.checked; } })]),
        el('td', { text: ZONE_LABELS[ch.stageZone] }),
        el('td', { text: ch.multicore ? ch.multicore.multicore : '—' }),
        el('td', { class: 'num', text: ch.multicore ? String(ch.multicore.line) : '—' }),
        el('td', { class: 'num', text: ch.input.device + ' ' + ch.input.connector }),
        el('td', {}, [ch.bandIds.length > 1
          ? el('span', { class: 'chip shared', text: 'משותף ×' + ch.bandIds.length })
          : el('span', { class: 'chip', text: ch.bandIds[0] || '—' })]),
        el('td', {}, [
          el('button', { class: 'ghost tiny', text: '↑', onclick: () => moveChannel(i, -1) }),
          el('button', { class: 'ghost tiny', text: '↓', onclick: () => moveChannel(i, 1) }),
        ]),
      ]));
    });
    table.appendChild(tbody);

    const main = el('section', { class: 'panel' }, [
      el('h2', {}, ['Megapatch']),
      el('div', { class: 'stat' }, [
        el('div', { html: '<b>' + plan.channels.length + '</b>ערוצים' }),
        el('div', { html: '<b>' + plan.channels.filter((c) => c.bandIds.length > 1).length + '</b>משותפים' }),
        el('div', { html: '<b>' + plan.multicoreLayout.length + '</b>מולטיקורים בשימוש' }),
        el('div', { html: '<b>' + errors.length + '</b>קונפליקטים' }),
      ]),
      el('div', { class: 'table-scroll' }, [table]),
      el('p', { class: 'hint', text: 'שינוי סדר מעדכן את מספרי הערוצים. כל שדה כאן ניתן לעריכה — המתכנן מייצר נקודת התחלה, לא גזר דין.' }),
      el('div', { class: 'actions' }, [
        el('button', { class: 'ghost', text: 'תכנן מחדש מהערוצים', onclick: () => { replan(); render(); } }),
        el('button', { class: 'primary', text: 'המשך לייצוא →', onclick: () => { state.step = 'export'; render(); } }),
      ]),
    ]);

    const conflictsPanel = el('section', { class: 'panel' }, [
      el('h2', {}, ['קונפליקטים ', errors.length
        ? el('span', { class: 'chip bad', text: errors.length + ' שגיאות' })
        : el('span', { class: 'chip shared', text: 'נקי' })]),
    ]);
    if (plan.conflicts.length === 0) {
      conflictsPanel.appendChild(el('p', { class: 'empty', text: 'התוכנית נכנסת במלאי הציוד.' }));
    } else {
      conflictsPanel.appendChild(el('ul', { class: 'notes' }, plan.conflicts.map((c) =>
        el('li', { class: c.severity }, [
          document.createTextNode(c.message),
          c.suggestion ? el('span', { class: 'suggestion', text: c.suggestion }) : null,
        ]))));
    }

    const layoutPanel = el('section', { class: 'panel' }, [el('h2', { text: 'פריסת במה' })]);
    if (plan.multicoreLayout.length === 0) {
      layoutPanel.appendChild(el('p', { class: 'empty', text: 'לא שויכו מולטיקורים.' }));
    } else {
      layoutPanel.appendChild(el('ul', { class: 'notes' }, plan.multicoreLayout.map((run) =>
        el('li', {}, [
          el('strong', { text: run.multicore }),
          document.createTextNode(' ← ' + ZONE_LABELS[run.stageZone]),
          el('span', { class: 'suggestion', text: run.lines.length + ' כניסות · ' + run.returnsUsed + ' מוניטורים' }),
        ]))));
    }

    return [el('div', { class: 'grid-2' }, [main, el('div', {}, [conflictsPanel, layoutPanel])])];
  }

  function moveChannel(index, delta) {
    const target = index + delta;
    const channels = state.plan.channels;
    if (target < 0 || target >= channels.length) return;
    const [moved] = channels.splice(index, 1);
    channels.splice(target, 0, moved);
    // Channel numbers follow position, so renumber rather than leave them stale.
    channels.forEach((c, i) => { c.channelNumber = i + 1; });
    render();
  }

  function exportScreen() {
    const plan = state.plan;
    if (!plan) {
      return [el('section', { class: 'panel' }, [el('p', { class: 'empty', text: 'אין תוכנית לייצא.' })])];
    }

    const scene = generateScene(plan);
    const csv = toCsv(plan);
    const errors = plan.conflicts.filter((c) => c.severity === 'error');

    const panel = el('section', { class: 'panel' }, [el('h2', { text: 'ייצוא' })]);

    if (errors.length > 0) {
      panel.appendChild(el('div', { class: 'caution', text:
        'יש ' + errors.length + ' קונפליקטים פתוחים. הייצוא יעבוד, אבל התוכנית לא נכנסת במלאי שהזנת.' }));
    }

    panel.appendChild(el('div', { class: 'stat' }, [
      // trimEnd first: the file ends with a newline, which would otherwise
      // count as an extra empty line.
      el('div', { html: '<b>' + scene.trimEnd().split('\n').length + '</b>שורות ב-‎.scn' }),
      el('div', { html: '<b>' + plan.channels.length + '</b>ערוצים מתוכנתים' }),
      el('div', { html: '<b>' + (scene.match(/^\/headamp/gm) || []).length + '</b>פרי-אמפים' }),
    ]));

    panel.appendChild(el('div', { class: 'actions' }, [
      el('button', { class: 'primary', text: 'הורד קובץ ‎.scn', onclick: () => save('stagepatch.scn', scene) }),
      el('button', { class: 'ghost', text: 'הורד CSV', onclick: () => save('stagepatch-megapatch.csv', csv) }),
    ]));

    if (state.downloadNote) {
      panel.appendChild(el('p', { class: 'hint', text: state.downloadNote }));
    }

    panel.appendChild(el('h3', { text: 'קובץ ה-Scene' }));
    panel.appendChild(el('pre', { class: 'scene', text: scene.split('\n').slice(0, 40).join('\n') + '\n…' }));
    panel.appendChild(el('p', { class: 'hint', text:
      'העתק לדיסק-און-קי ← Setup → Scenes → Load במיקסר. כל הפייזרים נטענים סגורים (‎-oo‎) בכוונה, ' +
      'וערוצים לא בשימוש נכתבים ריקים כדי שההופעה הקודמת לא תישאר עליהם.' }));

    panel.appendChild(el('div', { class: 'caution', html:
      '<strong>לפני שסומכים על זה בהופעה:</strong> טען את הקובץ ל-M32 או ל-M32-Edit במצב Offline ובדוק ' +
      'שמות, צבעים, פאטצ׳ והגדרות. אף קובץ שנוצר כאן עדיין לא אומת מול חומרה.' }));

    return [panel];
  }

  /**
   * Hand a file to the viewer. The capability may be absent and the viewer may
   * decline, so both cases are reported rather than failing silently.
   */
  async function save(filename, data) {
    state.downloadNote = '';
    try {
      const downloads = await window.claude?.use?.('downloads');
      if (!downloads) {
        state.downloadNote = 'ההורדה לא זמינה בתצוגה הזו. תוכן קובץ ה-Scene מוצג במלואו למטה להעתקה.';
        render();
        return;
      }
      await downloads.save({ filename, data });
    } catch (error) {
      state.downloadNote = 'ההורדה לא הושלמה: ' + (error && error.message ? error.message : String(error));
      render();
    }
  }

  // --- shell ---------------------------------------------------------------

  const STEPS = [
    ['inventory', '1 · מלאי ציוד'],
    ['channels', '2 · ערוצים'],
    ['patch', '3 · Megapatch'],
    ['export', '4 · ייצוא'],
  ];

  function render() {
    const app = document.getElementById('app');
    app.textContent = '';

    app.appendChild(el('header', { class: 'top' }, [
      el('h1', { text: 'StagePatch' }),
      el('span', { class: 'sub', text:
        state.inventory.console.model + ' · ' + state.requests.length + ' ערוצים מבוקשים · ' +
        state.bands.length + ' להקות' }),
    ]));

    app.appendChild(el('div', { class: 'banner', html:
      'מפרט טכני ← Megapatch ← קובץ Scene ל-MIDAS M32. ' +
      '<strong>זהו דמו של המנוע:</strong> התכנון, זיהוי הקונפליקטים וייצור קובץ ה-‎.scn‎ הם הקוד האמיתי. ' +
      'שלב חילוץ ה-AI מהמפרטים לא רץ כאן — דף מפורסם חסום מקריאה לשרת חיצוני.' }));

    app.appendChild(el('nav', { class: 'steps' }, STEPS.map(([id, label]) =>
      el('button', {
        'aria-current': state.step === id ? 'true' : 'false',
        text: label,
        onclick: () => { state.step = id; render(); },
      }))));

    let content;
    if (state.step === 'inventory') content = [inventoryScreen()];
    else if (state.step === 'channels') content = channelsScreen();
    else if (state.step === 'patch') content = patchScreen();
    else content = exportScreen();

    for (const node of content) app.appendChild(node);
  }

  render();
})();
</script>
